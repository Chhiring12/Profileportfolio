<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume | Chhiring Sherpa</title>
  <style>
    :root { --ink: #0a1426; --paper: #f6f8fc; --line: #dce3ed; --blue: #1769e0; --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; } body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); } a { color: inherit; text-decoration: none; }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 54px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 20px; } h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.7rem); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; } .button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-weight: 800; } .button.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .resume-frame { overflow: hidden; border: 1px solid var(--line); background: #fff; box-shadow: 0 14px 38px rgba(22,44,79,0.1); }
    .resume-page { display: block; width: 100%; height: auto; background: #fff; }
    .fallback { margin: 14px 0 0; color: #526174; font-size: 0.94rem; } .fallback a { color: var(--blue); font-weight: 800; }
    @media (max-width: 560px) { .topbar { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><h1>Resume</h1><div class="actions"><a class="button" href="index.html">Back to portfolio</a><a class="button primary" href="ChhiringSherpa_Resume.pdf" download>Download PDF</a></div></div>
    <section class="resume-frame" aria-label="Resume preview"><img class="resume-page" src="resume-page-1.png" alt="Resume of Chhiring Sherpa" /></section>
    <p class="fallback">Use the PDF button above for a downloadable copy.</p>
  </main>
</body>
</html>
