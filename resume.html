<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume | Chhiring Wangdi Sherpa</title>
  <style>
    :root {
      --bg: #05070c;
      --panel: #0d1117;
      --text: #ffffff;
      --muted: #aeb9ca;
      --line: rgba(148, 163, 184, 0.22);
      --accent: #38bdf8;
      --accent-strong: #2563eb;
      --radius: 8px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 84% 10%, rgba(56, 189, 248, 0.13), transparent 30%),
        linear-gradient(180deg, #05070c 0%, #08111f 48%, #05070c 100%);
      font-family: var(--font);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-weight: 800;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .button.primary {
      border-color: var(--accent);
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.13);
    }

    .resume-frame {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
    }

    .resume-frame img {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
    }

    .note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <h1>Resume</h1>
      <div class="actions">
        <a class="button" href="./index.html">Back</a>
        <a class="button primary" href="./Resume.pdf" download>Download PDF</a>
      </div>
    </div>
    <section class="resume-frame" aria-label="Resume preview">
      <img src="./resume-page-1.png" alt="Resume of Chhiring Wangdi Sherpa" />
    </section>
    <p class="note">If the browser does not show PDFs, use the preview above or download the PDF.</p>
  </main>
</body>
</html>
